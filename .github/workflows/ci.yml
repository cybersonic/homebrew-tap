name: CI

on:
  pull_request:
    paths:
      - 'Formula/**'

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap this repo
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/cybersonic"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/cybersonic/homebrew-tap"

      - name: Audit formula
        run: brew audit --strict lucli

      - name: Install formula
        run: brew install lucli

      - name: Test formula
        run: brew test lucli
